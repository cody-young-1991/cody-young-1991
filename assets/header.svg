<svg xmlns="http://www.w3.org/2000/svg" width="854" height="200" viewBox="0 0 854 200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
  </defs>
  <style>
    .title { font: 700 56px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; animation: fade 1.2s ease-in-out forwards; opacity: 0; }
    .sub { font: 500 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #4fc3f7; animation: fade 1.2s ease-in-out .4s forwards; opacity: 0; }
